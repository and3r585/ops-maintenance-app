<!doctype html>

  <script>
    // Dev cache-buster: always fetch the latest CSS/JS.
    (function () {
      var v = Date.now();
      var l = document.createElement("link");
      l.rel = "stylesheet"; l.href = "/styles.css?v=" + v;
      document.head.appendChild(l);
      window.__assetVersion = v;
    })();
  </script>
</head>
<body>
  <div id="root"><div class="spinner">Loading&hellip;</div></div>
  <script>
    (function () {
      var s = document.createElement("script");
      s.src = "/app.js?v=" + (window.__assetVersion || Date.now());
      document.body.appendChild(s);
    })();
  </script>
</body>
</html>
