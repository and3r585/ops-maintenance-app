# Render Blueprint — https://render.com/docs/blueprint-spec
#
# Deploy:
#   1. Push this repo to GitHub (done: and3r585/ops-maintenance-app)
#   2. Render dashboard -> New -> Blueprint -> pick this repo
#   3. Render reads this file, creates the service, builds and starts it
#
# The default below runs on Render's FREE plan: it works fully, but the
# filesystem is wiped on every restart/deploy, so pending entries and photos
# added through the app do not survive a restart (the ~570 imported pendings
# and all other data re-seed from source/*.csv on each cold start, ~1s).
#
# For durable storage, switch to a paid plan and a disk — see the commented
# block at the bottom.

services:
  - type: web
    name: site-portal
    runtime: python
    plan: free
    region: frankfurt          # closest to Kilgallioch; change if you like
    buildCommand: "true"       # stdlib only — nothing to install
    startCommand: python app.py
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.6"
      - key: ADMIN_PASSWORD    # strong password generated by Render; see the
        generateValue: true    # service's Environment tab to read it

# ---------------------------------------------------------------------------
# Durable storage (paid): replace the `plan` and add a disk + DATA_DIR.
#
#   plan: starter
#   disk:
#     name: site-portal-data
#     mountPath: /var/data
#     sizeGB: 1
#   envVars:
#     - key: DATA_DIR
#       value: /var/data
# ---------------------------------------------------------------------------
