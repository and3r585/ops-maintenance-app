# Render Blueprint — https://render.com/docs/blueprint-spec
#
# Deploy:
#   1. Push this repo to GitHub (done: and3r585/ops-maintenance-app)
#   2. Render dashboard -> New -> Blueprint -> pick this repo
#   3. Render reads this file, creates the service, builds and starts it
#   4. Log in as `admin` with the generated ADMIN_PASSWORD (service -> Environment tab)
#
# This service runs on Render's `starter` plan with a 1 GB persistent disk mounted
# at /var/data. DATA_DIR points the app at it, so the SQLite database and uploaded
# photos — every pending entry, completion photo/comment and date edited in-app —
# survive restarts AND deploys. The ~570 imported pendings still seed once from
# source/*.csv on the first boot and are then left alone.
#
# Cost: `starter` is a paid instance (~$7/mo) plus ~$0.25/GB-mo for the disk.
# To go back to the free, data-wiping setup: set `plan: free`, delete the `disk:`
# block and the DATA_DIR env var.
#
# Note: a service with a disk runs a single instance and does not get Render's
# zero-downtime deploys (a few seconds' blip on each deploy). Fine for this tool.

services:
  - type: web
    name: site-portal
    runtime: python
    plan: starter
    region: frankfurt          # closest to Kilgallioch; change if you like
    buildCommand: pip install -r requirements.txt   # Pillow (photo resizing)
    startCommand: python app.py
    healthCheckPath: /
    autoDeploy: true
    disk:
      name: site-portal-data
      mountPath: /var/data
      sizeGB: 1                # bump if photo uploads grow; SQLite itself is tiny
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.6"
      - key: PYTHONUNBUFFERED   # so the startup banner / migration lines reach the logs
        value: "1"
      - key: DATA_DIR          # DB + uploads live on the persistent disk
        value: /var/data
      - key: ADMIN_PASSWORD    # strong password generated by Render; read it in
        generateValue: true    # the service's Environment tab
